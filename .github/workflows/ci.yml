name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The shared core library (volodya4u/core) is not published to a Maven
      # repository, so build it and install it into the local one first.
      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  # Runs the packaged service against a real Kafka broker and checks that it
  # handles a withdrawal event sent the way TransferService sends it: JSON with a
  # __TypeId__ header naming the event class.
  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.2.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Create topic
        run: >-
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:9092 --create --if-not-exists
          --topic withdraw-money-topic --partitions 3 --replication-factor 1

      - name: Start service
        run: |
          nohup java -jar target/*.jar > service.log 2>&1 &
          timeout 120 bash -c 'until grep -q "partitions assigned" service.log; do sleep 2; done'

      - name: Send a withdrawal event
        run: |
          printf '%s\t%s\n' \
            '__TypeId__:com.appsdeveloperblog.ws.core.events.WithdrawalRequestedEvent' \
            '{"senderId":"smoke-sender","recepientId":"smoke-recipient","amount":42.5}' |
            docker exec -i ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-producer.sh \
              --bootstrap-server localhost:9092 --topic withdraw-money-topic \
              --reader-property parse.headers=true

      - name: Check that the service handled it
        run: |
          timeout 60 bash -c 'until grep -q "Received a new withdrawal event: 42.5" service.log; do sleep 2; done'

      - name: Show service log
        if: always()
        run: cat service.log || true

  # Merge Dependabot's patch and minor updates once build-and-test and the Kafka
  # smoke test have passed. Docker image updates and minor Spring Boot parent
  # updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, smoke-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
